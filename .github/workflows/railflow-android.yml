# RailFlow Android 읽기 전용 MVP — 테스트·린트·디버그 APK 빌드.
#
# 이 워크플로는 **Android 경로가 바뀔 때와 수동 실행에서만** 돈다.
# 웹 워크플로·배포 설정은 건드리지 않는다.
#
# 서명 키와 인증정보를 업로드하지 않는다. 디버그 APK 는 Android SDK 가
# 자동 생성하는 debug 키로 서명되며, 그 키스토어는 artifact 에 넣지 않는다.
#
# 실패한 이유를 annotation 으로 남긴다. 그래야 로그 파일을 직접 열 수 없는
# 환경에서도 무엇이 깨졌는지 알 수 있다.
name: RailFlow Android

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/railflow-android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: railflow-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 테스트·린트·디버그 APK
    runs-on: ubuntu-24.04

    steps:
      - name: 소스 가져오기
        uses: actions/checkout@v4

      - name: JDK 17 고정
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK 구성요소 고정 설치
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER" || SDKMANAGER="$(command -v sdkmanager)"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools"

      - name: Gradle 준비 (캐시 포함)
        uses: gradle/actions/setup-gradle@v4

      - name: 버전 확인 기록
        working-directory: android
        run: |
          set -euo pipefail
          java -version
          ./gradlew --version

      # 테스트·린트·APK 를 한 단계에서 돌리고 출력을 파일로 남긴다.
      # 뒤 단계가 그 파일에서 오류 줄만 뽑아 annotation 으로 올린다.
      - name: 단위 테스트 · 린트 · 디버그 APK
        id: gradle
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace \
            :observer:testDebugUnitTest :app:testDebugUnitTest \
            :observer:lintDebug :app:lintDebug \
            :app:assembleDebug 2>&1 | tee "$RUNNER_TEMP/gradle-output.txt"

      - name: 실패 원인을 annotation 으로 남기기
        if: failure()
        run: |
          set +e
          LOG="$RUNNER_TEMP/gradle-output.txt"
          test -f "$LOG" || { echo "::error::Gradle 출력 파일이 없습니다. SDK·Gradle 준비 단계에서 실패했습니다."; exit 0; }
          emit() {
            # annotation 한 줄에 개행을 넣을 수 없으므로 줄마다 하나씩 올린다.
            while IFS= read -r line; do
              [ -n "$line" ] || continue
              clean="$(printf '%s' "$line" | tr -d '\r' | sed 's/%/%25/g')"
              echo "::error::${clean}"
            done
          }

          # "> Task :..." 진행 로그는 버린다. 지난번에 이 줄들이 한도를 채워
          # 실제 오류를 밀어냈다.
          NOISE='^> Task |^> Configure |^Download |^Starting a Gradle Daemon|^Calculating task graph|^Welcome to Gradle'
          FILTERED="$RUNNER_TEMP/filtered.txt"
          grep -vE "$NOISE" "$LOG" > "$FILTERED" || true

          SIGNAL="$RUNNER_TEMP/signal.txt"
          grep -nE "^e: |^error: | error: |\.kt:[0-9]+:[0-9]+|FAILURE: Build|^\* What went wrong|^\* Where|Caused by: |Execution failed for task|Compilation error|tests? completed.*failed|FAILED$|Lint found [0-9]+ error|^[0-9]+ errors?," "$FILTERED" > "$SIGNAL" || true

          if [ -s "$SIGNAL" ]; then
            head -30 "$SIGNAL" | emit
          else
            # 패턴에 안 걸렸다. 꼬리를 그대로 올려 다음 판단 근거로 남긴다.
            echo "::error::알려진 오류 패턴에 걸리지 않았습니다. 로그 꼬리를 올립니다."
            tail -25 "$FILTERED" | emit
          fi
          {
            echo "## 빌드 실패"
            echo
            echo '```'
            tail -120 "$LOG"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: SHA-256 계산
        id: hash
        working-directory: android
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -name '*.apk' -print -quit)"
          test -n "$APK"
          mkdir -p ../artifact
          cp "$APK" "../artifact/railflow-readonly-debug.apk"
          cd ../artifact
          sha256sum railflow-readonly-debug.apk | tee railflow-readonly-debug.apk.sha256
          echo "sha256=$(cut -d' ' -f1 railflow-readonly-debug.apk.sha256)" >> "$GITHUB_OUTPUT"

      # --- 차단 원인 조사용 APK 검사 -------------------------------------
      # 소스 manifest 가 아니라 **실제로 만들어진 APK** 를 본다. 결과를
      # annotation 으로 올린다(이 저장소를 보는 환경에서 로그 파일을 열 수
      # 없다). 전체 출력은 artifact 로도 올린다.
      - name: APK 검사 - 환경 준비
        id: tools
        working-directory: android
        run: |
          set -euo pipefail
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          APKAN="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          APK="$(find app/build/outputs/apk/debug -name '*.apk' -print -quit)"
          mkdir -p ../inspect
          echo "bt=$BT"       >> "$GITHUB_OUTPUT"
          echo "apkan=$APKAN" >> "$GITHUB_OUTPUT"
          echo "apk=$APK"     >> "$GITHUB_OUTPUT"
          "$APKAN" manifest print "$APK" > ../inspect/merged-manifest.xml
          "$APKAN" manifest permissions "$APK" > ../inspect/permissions.txt
          "$APKAN" apk summary "$APK" > ../inspect/apk-summary.txt 2>&1 || true
          "$BT/aapt2" dump badging "$APK" > ../inspect/badging.txt
          "$BT/apksigner" verify -v --print-certs "$APK" > ../inspect/signer.txt 2>&1 || true
          "$BT/aapt2" dump xmltree --file res/xml/rail_observer_config.xml "$APK" > ../inspect/accessibility-config.txt 2>&1 || true
          ./gradlew --no-daemon -q :app:dependencies --configuration debugRuntimeClasspath > ../inspect/dependencies.txt 2>&1 || true
          wc -l ../inspect/*.txt ../inspect/*.xml

      - name: APK 검사 - 권한과 SDK
        working-directory: android
        run: |
          {
            echo "APK=$(basename '${{ steps.tools.outputs.apk }}')"
            grep -E "^(package|sdkVersion|targetSdkVersion|uses-permission|uses-feature|application-label:|application-debuggable)" ../inspect/badging.txt || true
            echo "선언된 권한 총 $(wc -l < ../inspect/permissions.txt)개"
            cat ../inspect/permissions.txt
          } | head -24 | while IFS= read -r l; do echo "::notice::[권한/SDK] ${l//%/%25}"; done

      - name: APK 검사 - merged manifest 요약
        working-directory: android
        run: |
          grep -nE "<(uses-permission|uses-sdk|uses-feature|service|activity|application|meta-data)" ../inspect/merged-manifest.xml \
            | sed 's/^[[:space:]]*//' | head -24 \
            | while IFS= read -r l; do echo "::notice::[manifest] ${l//%/%25}"; done
          grep -nE "android:(exported|permission|isAccessibilityTool|allowBackup|name)=" ../inspect/merged-manifest.xml \
            | sed 's/^[[:space:]]*//' | head -24 \
            | while IFS= read -r l; do echo "::notice::[manifest-attr] ${l//%/%25}"; done

      - name: APK 검사 - 접근성 설정과 서명
        working-directory: android
        run: |
          grep -E "A: |E: " ../inspect/accessibility-config.txt | sed 's/^[[:space:]]*//' | head -20 \
            | while IFS= read -r l; do echo "::notice::[a11y] ${l//%/%25}"; done
          grep -E "^(Verified using|Signer #1 certificate (DN|SHA-256)|Number of signers|DOES|WARNING)" ../inspect/signer.txt | head -12 \
            | while IFS= read -r l; do echo "::notice::[signer] ${l//%/%25}"; done

      - name: APK 검사 - 포함된 SDK
        working-directory: android
        run: |
          grep -E "^(\+---|\\---)" ../inspect/dependencies.txt | sed 's/[+\\|-]//g; s/^ *//' | sort -u | head -24 \
            | while IFS= read -r l; do echo "::notice::[sdk] ${l//%/%25}"; done

      - name: APK 검사 결과 업로드
        uses: actions/upload-artifact@v4
        with:
          name: railflow-apk-inspection
          path: inspect/
          if-no-files-found: error
          retention-days: 30

      - name: 결과 요약
        run: |
          {
            echo "## RailFlow Android 디버그 APK"
            echo
            echo "- 설치용 **디버그** 빌드입니다. 배포 서명이 아닙니다."
            echo "- SHA-256: \`${{ steps.hash.outputs.sha256 }}\`"
            echo "- 커밋: \`${{ github.sha }}\`"
            echo
            echo "빌드 성공은 **실제 휴대폰·철도 앱 검증이 아닙니다.**"
            echo "공식 철도 앱 화면 읽기 검증은 NOT RUN 입니다."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: SHA-256 을 annotation 으로 남기기
        run: echo "::notice::디버그 APK SHA-256 ${{ steps.hash.outputs.sha256 }}"

      - name: APK 와 SHA-256 업로드
        uses: actions/upload-artifact@v4
        with:
          name: railflow-readonly-debug-apk
          path: |
            artifact/railflow-readonly-debug.apk
            artifact/railflow-readonly-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: 실패 시 리포트 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: railflow-android-reports
          path: |
            android/app/build/reports/
            android/observer/build/reports/
            android/app/build/outputs/lint-results-debug.xml
            android/observer/build/outputs/lint-results-debug.xml
          if-no-files-found: ignore
          retention-days: 7
