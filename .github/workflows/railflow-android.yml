# RailFlow Android 읽기 전용 MVP — 테스트·린트·디버그 APK 빌드.
#
# 이 워크플로는 **Android 경로가 바뀔 때와 수동 실행에서만** 돈다.
# 웹 워크플로·배포 설정은 건드리지 않는다.
#
# 서명 키와 인증정보를 업로드하지 않는다. 디버그 APK 는 Android SDK 가
# 자동 생성하는 debug 키로 서명되며, 그 키스토어는 artifact 에 넣지 않는다.
#
# 실패한 이유를 annotation 으로 남긴다. 그래야 로그 파일을 직접 열 수 없는
# 환경에서도 무엇이 깨졌는지 알 수 있다.
name: RailFlow Android

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/railflow-android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: railflow-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 테스트·린트·디버그 APK
    runs-on: ubuntu-24.04

    steps:
      - name: 소스 가져오기
        uses: actions/checkout@v4

      - name: JDK 17 고정
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK 구성요소 고정 설치
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER" || SDKMANAGER="$(command -v sdkmanager)"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools"

      - name: Gradle 준비 (캐시 포함)
        uses: gradle/actions/setup-gradle@v4

      - name: 버전 확인 기록
        working-directory: android
        run: |
          set -euo pipefail
          java -version
          ./gradlew --version

      # 테스트·린트·APK 를 한 단계에서 돌리고 출력을 파일로 남긴다.
      # 뒤 단계가 그 파일에서 오류 줄만 뽑아 annotation 으로 올린다.
      # 로컬에서 빌드할 수 없는 환경이라 사소한 리소스 오류가 CI 왕복을
      # 만든다. 빌드 전에 XML 을 엄격히 검사해 한 번에 걸러낸다.
      # (python minidom 은 주석 안의 "--" 를 통과시키지만 AGP 의 파서는
      # 거부한다. 실제로 그 차이로 한 번 실패했다.)
      - name: 리소스 XML 엄격 검사
        working-directory: android
        run: |
          python3 - <<'PYEOF'
          import glob, io, re, sys
          import xml.etree.ElementTree as ET
          problems = []
          targets = glob.glob("*/src/main/res/**/*.xml", recursive=True)
          targets += glob.glob("*/src/main/AndroidManifest.xml")
          for path in sorted(targets):
              text = io.open(path, encoding="utf-8").read()
              for match in re.finditer(r"<!--(.*?)-->", text, re.S):
                  if "--" in match.group(1):
                      problems.append(f"{path}: 주석 안에 '--' 가 있습니다(XML 규칙 위반)")
              try:
                  ET.fromstring(text)
              except ET.ParseError as error:
                  problems.append(f"{path}: {error}")
          for p in problems:
              print(f"::error::[res-xml] {p}")
          print(f"검사한 XML {len(targets)}개, 문제 {len(problems)}개")
          sys.exit(1 if problems else 0)
          PYEOF

      - name: 단위 테스트 · 린트 · 디버그/릴리스 APK
        id: gradle
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace \
            :observer:testDebugUnitTest :app:testDebugUnitTest \
            :observer:lintDebug :app:lintDebug \
            :app:assembleDebug :app:assembleRelease 2>&1 | tee "$RUNNER_TEMP/gradle-output.txt"

      - name: 실패 원인을 annotation 으로 남기기
        if: failure()
        run: |
          set +e
          LOG="$RUNNER_TEMP/gradle-output.txt"
          test -f "$LOG" || { echo "::error::Gradle 출력 파일이 없습니다. SDK·Gradle 준비 단계에서 실패했습니다."; exit 0; }
          emit() {
            # annotation 한 줄에 개행을 넣을 수 없으므로 줄마다 하나씩 올린다.
            while IFS= read -r line; do
              [ -n "$line" ] || continue
              clean="$(printf '%s' "$line" | tr -d '\r' | sed 's/%/%25/g')"
              echo "::error::${clean}"
            done
          }

          # "> Task :..." 진행 로그는 버린다. 지난번에 이 줄들이 한도를 채워
          # 실제 오류를 밀어냈다.
          NOISE='^> Task |^> Configure |^Download |^Starting a Gradle Daemon|^Calculating task graph|^Welcome to Gradle'
          FILTERED="$RUNNER_TEMP/filtered.txt"
          grep -vE "$NOISE" "$LOG" > "$FILTERED" || true

          SIGNAL="$RUNNER_TEMP/signal.txt"
          grep -nE "^e: |^error: | error: |\.kt:[0-9]+:[0-9]+|FAILURE: Build|^\* What went wrong|^\* Where|Caused by: |Execution failed for task|Compilation error|tests? completed.*failed|FAILED$|Lint found [0-9]+ error|^[0-9]+ errors?," "$FILTERED" > "$SIGNAL" || true

          if [ -s "$SIGNAL" ]; then
            head -30 "$SIGNAL" | emit
          else
            # 패턴에 안 걸렸다. 꼬리를 그대로 올려 다음 판단 근거로 남긴다.
            echo "::error::알려진 오류 패턴에 걸리지 않았습니다. 로그 꼬리를 올립니다."
            tail -25 "$FILTERED" | emit
          fi
          {
            echo "## 빌드 실패"
            echo
            echo '```'
            tail -120 "$LOG"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: SHA-256 계산
        id: hash
        working-directory: android
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -name '*.apk' -print -quit)"
          test -n "$APK"
          mkdir -p ../artifact
          cp "$APK" "../artifact/railflow-readonly-debug.apk"
          REL="$(find app/build/outputs/apk/release -name '*.apk' -print -quit || true)"
          if [ -n "$REL" ]; then cp "$REL" "../artifact/railflow-readonly-release.apk"; fi
          cd ../artifact
          sha256sum *.apk | tee checksums.txt
          sha256sum railflow-readonly-debug.apk > railflow-readonly-debug.apk.sha256
          if [ -f railflow-readonly-release.apk ]; then
            sha256sum railflow-readonly-release.apk > railflow-readonly-release.apk.sha256
          fi
          echo "sha256=$(cut -d' ' -f1 railflow-readonly-debug.apk.sha256)" >> "$GITHUB_OUTPUT"

      # --- 차단 원인 조사용 APK 검사 -------------------------------------
      # 소스 manifest 가 아니라 **실제로 만들어진 APK** 를 본다.
      # annotation 은 단계당 10개까지만 API 로 돌아오므로 한 단계에 8줄
      # 이하만 올린다. 전체 출력은 artifact 로도 올린다.
      - name: APK 검사 - 자료 수집
        id: tools
        working-directory: android
        run: |
          set -euo pipefail
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          APKAN="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          DBG="$(find app/build/outputs/apk/debug -name '*.apk' -print -quit)"
          REL="$(find app/build/outputs/apk/release -name '*.apk' -print -quit || true)"
          mkdir -p ../inspect
          echo "dbg=$DBG" >> "$GITHUB_OUTPUT"
          echo "rel=$REL" >> "$GITHUB_OUTPUT"
          for pair in "debug:$DBG" "release:$REL"; do
            name="${pair%%:*}"; apk="${pair#*:}"
            [ -n "$apk" ] || continue
            "$APKAN" manifest print "$apk"        > "../inspect/$name-merged-manifest.xml"
            "$APKAN" manifest permissions "$apk"  > "../inspect/$name-permissions.txt"
            "$BT/aapt2" dump badging "$apk"       > "../inspect/$name-badging.txt"
            "$BT/apksigner" verify -v --print-certs "$apk" > "../inspect/$name-signer.txt" 2>&1 || true
            "$BT/aapt2" dump xmltree --file res/xml/rail_observer_config.xml "$apk" > "../inspect/$name-a11y.txt" 2>&1 || true
            sha256sum "$apk" >> ../inspect/sha256.txt
          done
          ./gradlew --no-daemon -q :app:dependencies --configuration releaseRuntimeClasspath > ../inspect/dependencies.txt 2>&1 || true
          ls -la ../inspect/

      - name: 검사 1 - 디버그 APK 권한
        working-directory: android
        run: |
          {
            echo "선언 권한 $(wc -l < ../inspect/debug-permissions.txt)개:"
            cat ../inspect/debug-permissions.txt
            grep -c "uses-permission" ../inspect/debug-badging.txt | sed 's/^/badging uses-permission 줄 수: /'
          } | head -8 | while IFS= read -r l; do echo "::notice::[debug-권한] ${l//%/%25}"; done

      - name: 검사 2 - 디버그 APK SDK·debuggable
        working-directory: android
        run: |
          grep -E "^(package|sdkVersion|targetSdkVersion|application-debuggable|application-label:)" ../inspect/debug-badging.txt \
            | head -8 | while IFS= read -r l; do echo "::notice::[debug-sdk] ${l//%/%25}"; done

      - name: 검사 3 - 접근성 서비스 선언
        working-directory: android
        run: |
          {
            grep -A6 "<service" ../inspect/debug-merged-manifest.xml | grep -E "android:(name|exported|permission)=" | sed 's/^ *//'
            grep -o 'isAccessibilityTool[^ ]*' ../inspect/debug-a11y.txt | head -2 || echo "isAccessibilityTool: 설정에 없음(기본값 false)"
          } | head -8 | while IFS= read -r l; do echo "::notice::[a11y-선언] ${l//%/%25}"; done

      - name: 검사 4 - 디버그 APK 서명
        working-directory: android
        run: |
          grep -E "^(Signer #1 certificate DN|Signer #1 certificate SHA-256|Number of signers|Verified using v[0-9])" ../inspect/debug-signer.txt \
            | head -8 | while IFS= read -r l; do echo "::notice::[debug-서명] ${l//%/%25}"; done

      - name: 검사 5 - 릴리스 APK 비교
        working-directory: android
        run: |
          if [ ! -f ../inspect/release-badging.txt ]; then
            echo "::notice::[release] release APK 가 없습니다."
            exit 0
          fi
          {
            grep -E "^(package|application-debuggable)" ../inspect/release-badging.txt || echo "application-debuggable 없음(= false)"
            grep -E "^(Number of signers|DOES NOT VERIFY|Verified using v2)" ../inspect/release-signer.txt | head -2 || echo "서명 확인 불가(서명되지 않음)"
            cat ../inspect/release-permissions.txt
          } | head -8 | while IFS= read -r l; do echo "::notice::[release] ${l//%/%25}"; done

      - name: 검사 6 - 네트워크 권한 부재 확인
        working-directory: android
        run: |
          {
            if grep -q "android.permission.INTERNET" ../inspect/debug-permissions.txt; then
              echo "INTERNET 권한이 있습니다 — 조사 필요"
            else
              echo "INTERNET 권한 없음 확인 (외부 전송 불가)"
            fi
            for p in SYSTEM_ALERT_WINDOW READ_SMS RECEIVE_SMS BIND_NOTIFICATION_LISTENER_SERVICE MANAGE_EXTERNAL_STORAGE READ_CONTACTS; do
              grep -q "$p" ../inspect/debug-permissions.txt && echo "$p 있음 — 조사 필요" || echo "$p 없음"
            done
          } | head -8 | while IFS= read -r l; do echo "::notice::[권한부재] ${l//%/%25}"; done

      - name: APK 검사 결과 업로드
        uses: actions/upload-artifact@v4
        with:
          name: railflow-apk-inspection
          path: inspect/
          if-no-files-found: error
          retention-days: 30

      - name: 결과 요약
        run: |
          {
            echo "## RailFlow Android 디버그 APK"
            echo
            echo "- 설치용 **디버그** 빌드입니다. 배포 서명이 아닙니다."
            echo "- SHA-256: \`${{ steps.hash.outputs.sha256 }}\`"
            echo "- 커밋: \`${{ github.sha }}\`"
            echo
            echo "빌드 성공은 **실제 휴대폰·철도 앱 검증이 아닙니다.**"
            echo "공식 철도 앱 화면 읽기 검증은 NOT RUN 입니다."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: SHA-256 을 annotation 으로 남기기
        run: echo "::notice::디버그 APK SHA-256 ${{ steps.hash.outputs.sha256 }}"

      - name: APK 와 SHA-256 업로드
        uses: actions/upload-artifact@v4
        with:
          name: railflow-readonly-debug-apk
          path: |
            artifact/railflow-readonly-debug.apk
            artifact/railflow-readonly-debug.apk.sha256
            artifact/railflow-readonly-release.apk
            artifact/railflow-readonly-release.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: 실패 시 리포트 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: railflow-android-reports
          path: |
            android/app/build/reports/
            android/observer/build/reports/
            android/app/build/outputs/lint-results-debug.xml
            android/observer/build/outputs/lint-results-debug.xml
          if-no-files-found: ignore
          retention-days: 7
